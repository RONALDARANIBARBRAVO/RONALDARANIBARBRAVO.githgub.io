<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title> Perú Sport </title>

<!--AQUI VA EL CSS -->
<!--AQUI VA EL CSS -->

	<style>

		body 
		{
            background-color: black;  /* Fondo negro */
            color: white;             /* Letras blancas */
            font-family: Georgia, 'Times New Roman', serif; /* Tipo de letra Georgia */
        }

        body > header /* este header es hijo directo de body, no es el header del artgicle, ojito con eso muchachoo*/
		
		
    	{
        text-align: center;       /* ¡Esta línea centra el h1, h2 e img! */
        padding: 30px 20px;       /* Le da espacio arriba, abajo y a los lados */
        border-bottom: 1px solid #333; /* línea de separacion */
    	}
		/* tamaño del titulo*/
		body > header h1
		{
		    font-size: 4.5rem;  /* tamaño del título */
		}

			.cursiva 
    		{
        	font-style: italic;       /* Pone el texto en cursiva */
    		}

		main article 
   		 {
        max-width: 800px; /* Limita el ancho para crear los espacios laterales */
        margin: 0 auto;    /* Centra el bloque horizontalmente */
        padding: 0 20px;   /* Espacio de seguridad para pantallas pequeñas */
        }

		main article img 
		{
			max-height: 300px; /* ancho maximo de las imagenes en el main*/
			height: auto;   /* mantiene la proporcion de la imagen*/
			display: block; /*necesario para el marging*/
  			margin: 0 auto;  /*centrado de imagen*/
		}
		.galeria {
        display: flex;           /* Pone las fotos en fila horizontal */
        justify-content: center; /* Las centra en la pantalla */
        gap: 15px;               /* Espacio de separación entre cada foto */
        margin-top: 20px;
        margin-bottom: 30px;     /* Espacio debajo de las fotos */
    	}
    	.galeria img {
        width: 33.33%;           /* Cada foto ocupa un tercio del ancho total */
        height: 250px;           /* Altura fija para que se vean parejas */
        object-fit: cover;       /* Recorta la foto para llenar el espacio sin deformar a los músicos */
        border-radius: 8px;      /* Bordes ligeramente redondeados */
        box-shadow: 0 4px 8px rgba(255,255,255,0.1); /* Sombra sutil para que resalten en el fondo negro */
    	}
	</style>

</head>

<!--CUERPO--><!--CUERPO-->


<body>
<!--CABEZERA Y LOGO-->

			<ul>
				<li><a href="#galeria">Galería</a></li>
				<li><a href="#nosotros">Nosotros</a></li>
			</ul>
		</nav>
		
	</header>

<!--CONTENIDO PRINCIPAL (MAIIN)-->

<!--====== (MAIIN)=========-->
	<main> 
	<article>  
		<div class="galeria">
		 <!-- Sección de fotos -->
    	 
        	<img src="imagenes/iwanna.jpeg">

    	</div>
    </article>
		 <!-- Link de youtube -->
    <article>
		<iframe
        width="560" height="315"

    </article>

</body>
